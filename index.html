<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e12" />
    <meta
      name="description"
      content="Uma plataforma para você aprender as principais ferramentas usadas no mercado de trabalho. Mais do que um ambiente de cursos, uma comunidade para estudar, realizar desafios de teste e se desenvolver."
    />

    <title>Capacitação QA Full Stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

  <body>
    <header class="hero container">
      <div class="hero-copy">
        <p class="badge" id="hero-badge"></p>
        <h1 id="hero-title"></h1>
        <p id="hero-description"></p>
        <div class="cta-row">
          <a
            class="btn"
            id="hero-cta"
            href="https://pay.kiwify.com.br/GxeLHvC"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
          <a
            class="btn btn-secondary"
            id="hero-whatsapp"
            href="https://wa.me/5519971727316?text=Tenho%20uma%20d%C3%BAvida%20sobre%20a%20Capacita%C3%A7%C3%A3o%20QA%20Full%20Stack"
            target="_blank"
            rel="noopener noreferrer"
          ></a>
        </div>
      </div>
      <figure class="hero-visual">
        <img
          src="Capa%20do%20curso.png"
          alt="Capa da Capacitação QA Full Stack, com laptop, checklist e ícones das ferramentas"
          width="1672"
          height="941"
        />

    <main class="container">
      <section class="section">
        <h2 id="audience-title"></h2>
        <ul class="card-list" id="audience-list"></ul>
      </section>

      <section class="section">
        <h2 id="visual-title"></h2>
        <ul class="card-list" id="visual-list"></ul>
      </section>

      <section class="journey" aria-labelledby="available-title">
        <h2 id="available-title"></h2>
        <div class="cover-grid" id="available-list"></div>
        <ul class="card-list cover-extra" id="available-extra"></ul>
      </section>

      <section class="journey" aria-labelledby="soon-title">
        <h2 id="soon-title"></h2>
        <div class="cover-grid" id="soon-list"></div>
      </section>

      <section class="section section-note">
        <p id="note-text"></p>
      </section>
    </main>

    <section class="footer-cta container" id="contato">
      <h2 id="footer-title"></h2>
      <div class="cta-row">
        <a
          class="btn"
          id="footer-checkout"
          href="https://pay.kiwify.com.br/GxeLHvC"
          target="_blank"
          rel="noopener noreferrer"
        ></a>
        <a
          class="btn btn-secondary"
          id="footer-whatsapp"
          href="https://wa.me/5519971727316?text=Tenho%20uma%20d%C3%BAvida%20sobre%20a%20Capacita%C3%A7%C3%A3o%20QA%20Full%20Stack"

          rel="noopener noreferrer"
        ></a>
      </div>
      <small class="small" id="footer-note"></small>
      <p class="small footer-links">
        <a href="https://www.youtube.com/channel/UCx1kzYA8YXAoCIMpbZfLRbw" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a href="https://www.linkedin.com/in/qagesmachado" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://linktr.ee/qagesmachado" target="_blank" rel="noopener noreferrer">linktr.ee/qagesmachado</a>
